<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Product: The Game</title>
<style>
  :root {
    color-scheme: light dark;
    --border: #ccc;
    --accent: #2a5fd0;
    --fg: #111;
    --bg: #fff;
    --panel-bg: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --border: #444;
      --fg: #eee;
      --bg: #111;
      --panel-bg: #1c1c1c;
    }
  }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    max-width: 780px;
    margin: 2rem auto;
    padding: 0 1rem;
    line-height: 1.4;
    background: var(--bg);
    color: var(--fg);
  }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.05rem; margin-top: 2rem; }
  table { border-collapse: collapse; width: 100%; margin: 0.5rem 0; }
  th, td { border: 1px solid var(--border); padding: 0.35rem 0.6rem; text-align: left; font-size: 0.9rem; }
  th { background: rgba(127, 127, 127, 0.1); }
  pre {
    white-space: pre-wrap;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.75rem;
    font-size: 0.85rem;
    background: rgba(127, 127, 127, 0.06);
  }
  #options { display: flex; flex-direction: column; gap: 0.4rem; margin: 0.5rem 0; }
  button {
    font: inherit;
    padding: 0.5rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel-bg);
    color: var(--fg);
    cursor: pointer;
    text-align: left;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  #newGameForm { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  #newGameForm input {
    font: inherit;
    padding: 0.4rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--panel-bg);
    color: var(--fg);
  }
  #playerIds { flex: 1; min-width: 220px; }
  #seed { width: 100px; }
  .meta { color: #666; font-size: 0.85rem; }
  .outcome { padding: 0.75rem 1rem; border-radius: 6px; font-weight: 600; margin: 0.75rem 0; }
  .outcome.win { background: #d7f5d7; color: #14591e; }
  .outcome.loss { background: #f8d7d7; color: #7a1414; }
  #error { color: #b30000; font-size: 0.9rem; min-height: 1.2em; }
  #game { display: none; }

  #board { display: flex; flex-wrap: wrap; gap: 1rem; margin: 0.5rem 0 1rem; }
  .quadrantBoard { flex: 1 1 200px; max-width: 240px; text-align: center; }
  .quadrantBoard svg { width: 100%; height: auto; }
  .quadrantBoard .quadrantLabel { font-size: 0.8rem; font-weight: 600; margin-top: 0.25rem; }
  .quadrantBoard .milestoneLabel { font-size: 0.75rem; color: #888; }
  #boardLegend {
    display: flex; flex-wrap: wrap; gap: 0.6rem 1rem; font-size: 0.78rem; margin: 0.25rem 0 1rem;
  }
  #boardLegend span { display: inline-flex; align-items: center; gap: 0.3rem; }
  #boardLegend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  #activityLog {
    max-height: 220px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.6rem 0.75rem;
    background: rgba(127, 127, 127, 0.06);
    font-size: 0.85rem;
  }
  #activityLog .activityLine { padding: 0.15rem 0; border-bottom: 1px dotted var(--border); }
  #activityLog .activityLine:last-child { border-bottom: none; }
  #activityLog .empty { color: #888; font-style: italic; }
</style>
</head>
<body>
  <h1>Product: The Game</h1>

  <form id="newGameForm">
    <input id="playerIds" type="text" placeholder="Player ids, comma-separated (e.g. alice,bob,carol)" required />
    <input id="seed" type="number" placeholder="seed (optional)" />
    <button type="submit">New Game</button>
  </form>
  <div id="error"></div>

  <div id="game">
    <p class="meta" id="metaLine"></p>

    <div id="outcomeBanner"></div>

    <h2>Board</h2>
    <div id="boardLegend"></div>
    <div id="board"></div>

    <h2>Players</h2>
    <table id="playersTable"><thead>
      <tr><th>Player</th><th>Role</th><th>Skill</th></tr>
    </thead><tbody></tbody></table>

    <h2>Portfolio</h2>
    <table id="portfolioTable"><thead>
      <tr><th>Concept</th><th>Quadrant</th><th>Offset</th><th>D</th><th>V</th><th>F</th></tr>
    </thead><tbody></tbody></table>

    <h2>Activity</h2>
    <div id="activityLog"><div class="empty">Nothing has happened yet.</div></div>

    <h2>State</h2>
    <pre id="observation"></pre>

    <h2 id="decisionHeading"></h2>
    <div id="options"></div>
  </div>

<script>
let gameId = null;
let boardData = null;
let activityLog = [];

const SPACE_COLORS = {
  gateway: '#999999',
  D: '#4f8ef7',
  V: '#f7a94f',
  F: '#4fc97a',
  skills: '#b06ff7',
  chance: '#f75f6f',
};
const SPACE_LABELS = {
  gateway: 'Gateway',
  D: 'Desirability',
  V: 'Viability',
  F: 'Feasibility',
  skills: 'Skills',
  chance: 'Chance',
};

function showError(message) {
  document.getElementById('error').textContent = message || '';
}

async function api(path, options) {
  const response = await fetch(path, options);
  const body = await response.json();
  if (!response.ok) {
    throw new Error(body.detail || `request failed (${response.status})`);
  }
  return body;
}

async function loadBoard() {
  if (boardData) return boardData;
  boardData = await api('/board');
  renderBoardLegend();
  return boardData;
}

function renderBoardLegend() {
  const el = document.getElementById('boardLegend');
  el.innerHTML = '';
  for (const key of ['gateway', 'D', 'V', 'F', 'skills', 'chance']) {
    const span = document.createElement('span');
    span.innerHTML = `<i style="background:${SPACE_COLORS[key]}"></i>${SPACE_LABELS[key]}`;
    el.appendChild(span);
  }
}

function nodePoint(i, total, cx, cy, r) {
  const angle = (i / total) * 2 * Math.PI - Math.PI / 2;
  return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
}

function renderBoard(view) {
  const container = document.getElementById('board');
  container.innerHTML = '';
  if (!boardData) return;

  const size = 200;
  const cx = size / 2;
  const cy = size / 2;
  const trackR = 78;
  const markerR = 58;
  const total = 16; // Gateway (offset 0) + 15 coded spaces

  for (const quadrant of boardData.quadrants) {
    const svgParts = [
      `<circle cx="${cx}" cy="${cy}" r="${trackR}" fill="none" stroke="var(--border)" stroke-width="1" />`,
    ];

    for (let i = 0; i < total; i++) {
      const [x, y] = nodePoint(i, total, cx, cy, trackR);
      const type = i === 0 ? 'gateway' : quadrant.spaces[i - 1];
      const color = SPACE_COLORS[type] || '#999';
      const r = i === 0 ? 7 : 5.5;
      svgParts.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${color}" />`);
    }

    const here = view.portfolio.filter((c) => c.quadrant === quadrant.id);
    const byOffset = {};
    for (const c of here) {
      (byOffset[c.offset] = byOffset[c.offset] || []).push(c);
    }
    for (const [offsetStr, concepts] of Object.entries(byOffset)) {
      const offset = Number(offsetStr);
      const [bx, by] = nodePoint(offset, total, cx, cy, markerR);
      concepts.forEach((c, idx) => {
        const spread = (idx - (concepts.length - 1) / 2) * 12;
        const angle = Math.atan2(by - cy, bx - cx) + Math.PI / 2;
        const mx = bx + Math.cos(angle) * spread;
        const my = by + Math.sin(angle) * spread;
        const initials = c.name
          .split(/\s+/)
          .map((w) => w[0])
          .join('')
          .slice(0, 2)
          .toUpperCase();
        svgParts.push(
          `<g><circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="9" fill="var(--accent)" ` +
            `stroke="var(--bg)" stroke-width="1.5"><title>${c.name}</title></circle>` +
            `<text x="${mx.toFixed(1)}" y="${(my + 3).toFixed(1)}" font-size="8" ` +
            `text-anchor="middle" fill="#fff">${initials}</text></g>`
        );
      });
    }

    const wrapper = document.createElement('div');
    wrapper.className = 'quadrantBoard';
    wrapper.innerHTML =
      `<svg viewBox="0 0 ${size} ${size}">${svgParts.join('')}</svg>` +
      `<div class="quadrantLabel">${quadrant.name}</div>` +
      `<div class="milestoneLabel">${quadrant.milestone_name}</div>`;
    container.appendChild(wrapper);
  }
}

function pushEvent(text) {
  if (!text) return;
  activityLog.unshift(text);
  if (activityLog.length > 50) activityLog.length = 50;
  renderActivityLog();
}

function renderActivityLog() {
  const el = document.getElementById('activityLog');
  el.innerHTML = '';
  if (activityLog.length === 0) {
    el.innerHTML = '<div class="empty">Nothing has happened yet.</div>';
    return;
  }
  for (const line of activityLog) {
    const div = document.createElement('div');
    div.className = 'activityLine';
    div.textContent = line;
    el.appendChild(div);
  }
}

async function render(view) {
  gameId = view.game_id;
  document.getElementById('game').style.display = 'block';
  document.getElementById('metaLine').textContent =
    `Game ${view.game_id.slice(0, 8)} · seed ${view.seed} · turn ${view.turn} of 50 · TAM bank $${view.bank.toFixed(2)}B`;

  await loadBoard();
  renderBoard(view);
  pushEvent(view.last_event);

  const playersBody = document.querySelector('#playersTable tbody');
  playersBody.innerHTML = '';
  for (const p of view.players) {
    const row = playersBody.insertRow();
    row.insertCell().textContent = p.id;
    row.insertCell().textContent = p.role_id;
    row.insertCell().textContent = p.skill_name || '—';
  }

  const portfolioBody = document.querySelector('#portfolioTable tbody');
  portfolioBody.innerHTML = '';
  for (const c of view.portfolio) {
    const row = portfolioBody.insertRow();
    row.insertCell().textContent = c.name;
    row.insertCell().textContent = c.quadrant;
    row.insertCell().textContent = c.offset;
    row.insertCell().textContent = c.tokens.D;
    row.insertCell().textContent = c.tokens.V;
    row.insertCell().textContent = c.tokens.F;
  }

  document.getElementById('observation').textContent = view.observation;

  const outcomeBanner = document.getElementById('outcomeBanner');
  const optionsDiv = document.getElementById('options');
  const heading = document.getElementById('decisionHeading');
  optionsDiv.innerHTML = '';

  if (view.outcome) {
    outcomeBanner.innerHTML = '';
    const banner = document.createElement('div');
    banner.className = `outcome ${view.outcome.result}`;
    banner.textContent = `${view.outcome.result.toUpperCase()} — ${view.outcome.reason}`;
    outcomeBanner.appendChild(banner);
    heading.textContent = '';
    return;
  }
  outcomeBanner.innerHTML = '';
  heading.textContent = `Deciding as ${view.decision_owner} (${view.decision_kind})`;

  for (const option of view.options) {
    const button = document.createElement('button');
    button.textContent = `${option.index}. ${option.description}`;
    button.addEventListener('click', () => chooseAction(option.index));
    optionsDiv.appendChild(button);
  }
}

async function chooseAction(index) {
  showError('');
  const buttons = document.querySelectorAll('#options button');
  buttons.forEach((b) => (b.disabled = true));
  try {
    const view = await api(`/games/${gameId}/actions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action_index: index }),
    });
    await render(view);
  } catch (err) {
    showError(err.message);
    buttons.forEach((b) => (b.disabled = false));
  }
}

document.getElementById('newGameForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  showError('');
  const playerIds = document.getElementById('playerIds').value
    .split(',')
    .map((s) => s.trim())
    .filter(Boolean);
  const seedValue = document.getElementById('seed').value;
  const body = { player_ids: playerIds };
  if (seedValue !== '') body.seed = Number(seedValue);

  try {
    const view = await api('/games', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    activityLog = [];
    await render(view);
  } catch (err) {
    showError(err.message);
  }
});
</script>
</body>
</html>
